name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do NOT cancel in-progress runs — cancelling mid-deploy can leave the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Supplies base_path so next.config derives basePath from where Pages actually
      # serves the site (repo-rename-proof), instead of trusting a hardcoded default.
      - uses: actions/configure-pages@v6
        id: pages

      - run: npm ci

      - run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

      - uses: actions/deploy-pages@v5
        id: deployment
