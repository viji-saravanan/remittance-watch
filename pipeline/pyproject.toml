[project]
name = "remittance-watch-pipeline"
version = "0.1.0"
description = "World Bank Remittance Prices Worldwide ingestion pipeline — workbook in, tested Postgres dataset out"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
rw-ingest = "remittance_watch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remittance_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
